<svg xmlns="http://www.w3.org/2000/svg" width="860" height="252" viewBox="0 0 860 252" role="img" aria-label="mabatID/"><style>text{font-family:"Fira Code","JetBrains Mono",SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;font-size:14px}.p{fill:#7ee787}.c{fill:#e6edf3}.o{fill:#79c0ff}.d{fill:#8b949e}.h{font-size:18px;font-weight:700}.s{font-size:12px}</style><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#24c6dc"/><stop offset="1" stop-color="#7ee787"/></linearGradient></defs><rect x="1" y="1" width="858" height="250" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/><rect x="1" y="1" width="858" height="250" rx="10" fill="none" stroke="url(#g)" stroke-width="2" stroke-linecap="round" stroke-dasharray="356 2224"><animate attributeName="stroke-dashoffset" from="0" to="-2224" dur="6s" repeatCount="indefinite"/></rect><text class="d s" x="20" y="28">~/projects</text><text class="o h" x="20" y="54">mabatID/</text><rect x="765" y="36" width="77" height="22" rx="11" fill="#7ee787" fill-opacity="0.15" stroke="#7ee787"/><text class="p s" x="803" y="51" text-anchor="middle">★ LATEST</text><text class="c" x="20" y="84" opacity="0">A mobile-friendly web app that guides young Filipinos through getting government IDs.<animate attributeName="opacity" from="0" to="1" begin="0.20s" dur="0.4s" fill="freeze"/></text><text class="c" x="20" y="106" opacity="0">Many IDs need another ID first, so it maps the chain: what to gather, and what each ID unlocks.<animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.4s" fill="freeze"/></text><text class="d" x="20" y="128" opacity="0">▸ interactive ID path graph   ▸ fewest-documents / lowest-fee route planner<animate attributeName="opacity" from="0" to="1" begin="0.70s" dur="0.4s" fill="freeze"/></text><text class="d" x="20" y="150" opacity="0">▸ checklists &amp; progress tracking   ▸ 21 application guides<animate attributeName="opacity" from="0" to="1" begin="0.95s" dur="0.4s" fill="freeze"/></text><text class="d" x="20" y="172" opacity="0">Built with Xavier Imbang. Backend, database and planning logic by me.<animate attributeName="opacity" from="0" to="1" begin="1.20s" dur="0.4s" fill="freeze"/></text><text class="p s" x="20" y="210">[Next.js 16] [React 19] [TypeScript] [Tailwind 4] [Supabase]</text><text class="o s" x="20" y="234">→ github.com/kitarsin/mabatID</text></svg>